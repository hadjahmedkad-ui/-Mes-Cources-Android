name: Compiler APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Vérifier les fichiers de l'application
        run: |
          test -s www/index.html
          test -s www/icone.png
          test -s www/sw.js
          test -s www/manifest.webmanifest
      - name: Installer Capacitor
        run: npm install
      - name: Préparer Android
        run: npx cap add android
      - name: Générer icône Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair
            convert www/icone.png -resize "${2}x${2}" android/app/src/main/res/mipmap-$1/ic_launcher.png
            cp android/app/src/main/res/mipmap-$1/ic_launcher.png android/app/src/main/res/mipmap-$1/ic_launcher_round.png
          done
      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Mes-cources-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
