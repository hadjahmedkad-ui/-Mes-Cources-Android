name: Compiler APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Vérifier les fichiers de l'application
        run: |
          test -s www/index.html
          test -s www/sw.js
          test -s www/manifest.webmanifest
      - name: Installer Capacitor
        run: npm install
      - name: Préparer Android
        run: npx cap add android
      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Mes-cources-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
